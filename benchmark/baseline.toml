# benchmark/baseline.toml — committed PERF baseline (bead padetaylor-krgy.11).
#
# Median + min wall time (ns) and allocations of each hot path, captured on this
# box with threads pinned to 1.  The gate (benchmark/run_perf_gate.jl) asserts,
# per case, current_min <= min_ns * (1 + SLACK) (the MIN is the noise-floor
# estimator; SLACK lives in the tool — a single calibrated band documented in
# benchmark/README.md).
#
# These are FLOOR numbers: the minimum across 4 back-to-back captures per path
# (the noise-free estimate — BenchmarkTools' minimum philosophy applied across
# reps), since a perfectly-idle WSL2 capture is not always available.  See
# benchmark/README.md §"Calibrating the slack" + §"Idle-box discipline".
#
# LOCAL (no-CI) baseline (Rule 11).  These numbers are platform-specific; a
# different CPU/BLAS will shift them — the SLACK band absorbs small jitter, NOT
# order-of-magnitude moves.  REGENERATE (explicit, reviewed commit — never
# silent), then review the git diff and commit:
#   PADETAYLOR_REGEN_PERF_BASELINE=1 julia --project=benchmark benchmark/run_perf_gate.jl
